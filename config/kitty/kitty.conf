# ── Colours ──────────────────────────────────────────────────────────────
# Generated by the quickshell bar from the selected Catppuccin flavour and
# accent. Edit services/KittyTheme.qml, not colors.conf — it is overwritten.
include colors.conf

# ── Remote control ───────────────────────────────────────────────────────
# Lets the quickshell bar push colours into already-open terminals when the
# flavour or accent changes. Without this, a colour change only reaches new
# windows and every terminal has to be restarted by hand.
allow_remote_control yes
listen_on unix:@mykitty

# ── Font ──────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ── Window ────────────────────────────────────────────────────────────────
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

# ── Cursor ────────────────────────────────────────────────────────────────
cursor_shape          block
cursor_blink_interval 0
cursor_trail          1

# ── Scrollback ────────────────────────────────────────────────────────────
scrollback_lines 10000

# ── Tab bar ───────────────────────────────────────────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"

# ── Bell ──────────────────────────────────────────────────────────────────
enable_audio_bell no

# ── Keybinds ──────────────────────────────────────────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+w close_tab
map ctrl+shift+] next_tab
map ctrl+shift+[ previous_tab
map ctrl+shift+enter new_window_with_cwd
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0
